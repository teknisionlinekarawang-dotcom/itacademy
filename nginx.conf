server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip untuk aset teks
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Modul IoT Lab (vanilla, diserve statis dari dist/iot-lab)
    location /iot-lab/ {
        try_files $uri $uri/ /iot-lab/index.html;
    }

    # SPA fallback: semua route React Router jatuh ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresif untuk aset bertanda hash dari Vite
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
